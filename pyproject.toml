[project]
name = "hierarchical-clustering-portfolio-selector"
version = "0.1.0"
description = "Quantitative pipeline: hierarchical clustering asset selection with risk parity allocation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "matplotlib",
    "seaborn",
    "yfinance",
    "scipy",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
