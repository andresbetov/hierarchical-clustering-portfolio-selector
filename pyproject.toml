[project]
name = "hierarchical-clustering-portfolio-selector"
version = "0.1.0"
description = "Quantitative pipeline: hierarchical clustering asset selection with risk parity allocation"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "matplotlib",
    "seaborn",
    "yfinance",
    "scipy",
    "scikit-learn>=1.8",
    "pyyaml>=6.0",
    "pyarrow>=14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_engine"]

[project.scripts]
portfolio-run = "portfolio_engine.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyright>=1.1.403",
    "hypothesis>=6.100",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["portfolio_engine", "scripts"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=portfolio_engine --cov-report=term-missing --cov-report=html --cov-report=xml --cov-branch --cov-fail-under=85"
pythonpath = ["."]

[tool.coverage.run]
source = ["portfolio_engine"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# single source: 85 branch (87 line) — baseline 2026-09-05: 85.37% branch / 87% line (1509 stmts, 230 tests)
show_missing = true
skip_empty = true
precision = 1
fail_under = 85  # mirrors --cov-fail-under=85 in [tool.pytest.ini_options] addopts + Makefile + CI
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
