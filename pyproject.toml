[project]
name = "hierarchical-clustering-portfolio-selector"
version = "0.1.0"
description = "Quantitative pipeline: hierarchical clustering asset selection with risk parity allocation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "matplotlib",
    "seaborn",
    "yfinance",
    "scipy",
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pyright>=1.1.403",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["portfolio_engine", "scripts"]
exclude = ["**/__pycache__", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
