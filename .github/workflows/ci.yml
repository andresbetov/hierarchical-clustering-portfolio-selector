name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  quality:
    # Pinned rather than ubuntu-latest: the latest label migrates to Ubuntu 26 on
    # 2026-10-19 (actions/runner-images#14748). Pinning keeps the gate on the
    # currently-verified image instead of taking that change unattended.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Test suite with coverage gate (pytest)
        run: uv run python -m pytest --cov=portfolio_engine --cov-report=term-missing --cov-report=html --cov-report=xml --cov-branch --cov-fail-under=85

      - name: Publish coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY 2>&1 || uv run coverage report >> $GITHUB_STEP_SUMMARY 2>&1 || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov
          if-no-files-found: warn

      - name: Syntax check (compileall)
        run: uv run python -m compileall -q -x '(^|/)(\.?venv|env|node_modules|build|dist|__pycache__)(/|$)' .
